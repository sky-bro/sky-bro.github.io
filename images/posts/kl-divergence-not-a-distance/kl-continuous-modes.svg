<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">Forward and reverse KL on continuous distributions</title>
  <desc id="desc">A bimodal target distribution P compared with two candidate approximations Q: a broad covering distribution and a narrow mode-seeking distribution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="138%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="1180" height="680" fill="url(#bg)"/>
  <text x="64" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Continuous View: Covering vs Seeking</text>
  <text x="64" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">A two-peak target distribution makes the two KL directions easier to inspect.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="64" y="150" width="500" height="380" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="104" y="202" font-size="26" font-weight="800" fill="#1d4ed8">Forward KL: D<tspan baseline-shift="sub" font-size="16">KL</tspan>(P || Q)</text>
      <text x="104" y="232" font-size="16" fill="#475569">P weights both peaks, so Q is penalized for missing either one.</text>

      <line x1="104" y1="455" x2="520" y2="455" stroke="#94a3b8" stroke-width="2"/>
      <line x1="124" y1="455" x2="124" y2="265" stroke="#94a3b8" stroke-width="2"/>
      <text x="505" y="482" font-size="15" fill="#64748b">x</text>
      <text x="92" y="275" font-size="15" fill="#64748b">density</text>

      <path d="M104 452 C142 452 160 443 176 405 C194 360 214 292 250 292 C286 292 306 360 324 405 C340 443 358 452 382 452 C406 452 420 443 436 405 C454 360 474 292 510 292 C546 292 552 390 520 452" fill="none" stroke="#0f172a" stroke-width="4"/>
      <path d="M116 454 C170 450 200 400 230 352 C262 300 300 292 338 322 C378 354 400 412 430 445 C456 454 488 454 520 454" fill="none" stroke="#2563eb" stroke-width="5"/>

      <rect x="120" y="486" width="18" height="6" rx="3" fill="#0f172a"/>
      <text x="148" y="495" font-size="15" fill="#334155">P target: two high-density peaks</text>
      <rect x="120" y="512" width="18" height="6" rx="3" fill="#2563eb"/>
      <text x="148" y="521" font-size="15" fill="#334155">Q covers both, but spills into the valley</text>

    </g>

    <g filter="url(#shadow)">
      <rect x="616" y="150" width="500" height="380" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="656" y="202" font-size="26" font-weight="800" fill="#be123c">Reverse KL: D<tspan baseline-shift="sub" font-size="16">KL</tspan>(Q || P)</text>
      <text x="656" y="232" font-size="16" fill="#475569">Q weights its own samples, so it avoids low-density regions of P.</text>

      <line x1="656" y1="455" x2="1072" y2="455" stroke="#94a3b8" stroke-width="2"/>
      <line x1="676" y1="455" x2="676" y2="265" stroke="#94a3b8" stroke-width="2"/>
      <text x="1057" y="482" font-size="15" fill="#64748b">x</text>
      <text x="644" y="275" font-size="15" fill="#64748b">density</text>

      <path d="M656 452 C694 452 712 443 728 405 C746 360 766 292 802 292 C838 292 858 360 876 405 C892 443 910 452 934 452 C958 452 972 443 988 405 C1006 360 1026 292 1062 292 C1098 292 1104 390 1072 452" fill="none" stroke="#0f172a" stroke-width="4"/>
      <path d="M694 454 C716 451 736 420 752 363 C770 300 790 272 816 292 C842 312 858 382 870 454" fill="none" stroke="#e11d48" stroke-width="5"/>

      <rect x="672" y="486" width="18" height="6" rx="3" fill="#0f172a"/>
      <text x="700" y="495" font-size="15" fill="#334155">P target: two high-density peaks</text>
      <rect x="672" y="512" width="18" height="6" rx="3" fill="#e11d48"/>
      <text x="700" y="521" font-size="15" fill="#334155">Q picks one safe peak</text>

      <path d="M910 430 C936 395 954 372 978 342" fill="none" stroke="#e11d48" stroke-width="3" marker-end="url(#arrowRose)"/>
      <text x="900" y="424" font-size="15" font-weight="700" fill="#be123c">valley mass is costly</text>
    </g>

    <rect x="148" y="574" width="884" height="62" rx="16" fill="#0f172a" opacity="0.94"/>
    <text x="188" y="601" font-size="18" font-weight="800" fill="#ffffff">The approximation changes because the expectation changes.</text>
    <text x="188" y="625" font-size="15" fill="#cbd5e1">Forward KL weights P's support. Reverse KL weights Q's own samples.</text>
  </g>
</svg>
