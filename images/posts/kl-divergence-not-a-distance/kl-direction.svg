<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
  <title id="title">KL divergence direction matters</title>
  <desc id="desc">Two probability distributions P and Q, with arrows showing KL P to Q and KL Q to P as different questions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRose" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="1180" height="640" fill="url(#bg)"/>
  <text x="64" y="72" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#0f172a">KL Direction Is A Question, Not A Symmetric Distance</text>
  <text x="64" y="110" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">The left argument decides where mistakes are weighted.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="84" y="170" width="360" height="300" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="124" y="220" font-size="28" font-weight="800" fill="#0f172a">P: target / data</text>
      <text x="124" y="252" font-size="17" fill="#475569">Event A and B both matter.</text>
      <line x1="140" y1="410" x2="390" y2="410" stroke="#94a3b8" stroke-width="2"/>
      <line x1="170" y1="410" x2="170" y2="280" stroke="#94a3b8" stroke-width="2"/>
      <rect x="200" y="315" width="58" height="95" rx="8" fill="#60a5fa"/>
      <rect x="305" y="315" width="58" height="95" rx="8" fill="#60a5fa"/>
      <text x="219" y="440" font-size="16" fill="#334155">A</text>
      <text x="324" y="440" font-size="16" fill="#334155">B</text>
      <text x="208" y="306" font-size="16" fill="#1d4ed8">0.5</text>
      <text x="313" y="306" font-size="16" fill="#1d4ed8">0.5</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="736" y="170" width="360" height="300" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="776" y="220" font-size="28" font-weight="800" fill="#0f172a">Q: approximation</text>
      <text x="776" y="252" font-size="17" fill="#475569">Almost all mass is on A.</text>
      <line x1="792" y1="410" x2="1042" y2="410" stroke="#94a3b8" stroke-width="2"/>
      <line x1="822" y1="410" x2="822" y2="280" stroke="#94a3b8" stroke-width="2"/>
      <rect x="852" y="226" width="58" height="184" rx="8" fill="#fb7185"/>
      <rect x="957" y="402" width="58" height="8" rx="4" fill="#fb7185"/>
      <text x="871" y="440" font-size="16" fill="#334155">A</text>
      <text x="976" y="440" font-size="16" fill="#334155">B</text>
      <text x="860" y="252" font-size="16" font-weight="800" fill="#ffffff">0.99</text>
      <text x="963" y="392" font-size="16" fill="#be123c">0.01</text>
    </g>

    <path d="M460 268 C548 188 650 188 720 268" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="500" y="150" width="242" height="78" rx="16" fill="#eef6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="532" y="182" font-size="22" font-weight="800" fill="#1d4ed8">KL(P || Q)</text>
    <text x="520" y="212" font-size="16" fill="#1e40af">Can Q cover what P cares about?</text>

    <path d="M720 382 C630 486 526 486 460 382" stroke="#e11d48" stroke-width="4" fill="none" marker-end="url(#arrowRose)"/>
    <rect x="500" y="476" width="260" height="78" rx="16" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
    <text x="532" y="508" font-size="22" font-weight="800" fill="#be123c">KL(Q || P)</text>
    <text x="518" y="538" font-size="16" fill="#9f1239">Can P explain what Q actually uses?</text>

    <rect x="184" y="568" width="812" height="58" rx="16" fill="#0f172a" opacity="0.93"/>
    <text x="224" y="594" font-size="18" font-weight="800" fill="#ffffff">Same distributions, different weighted mistakes.</text>
    <text x="224" y="616" font-size="15" fill="#cbd5e1">Swap the arguments, and the training pressure changes.</text>
  </g>
</svg>
