<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">Entropy, cross entropy, and KL decomposition</title>
  <desc id="desc">Cross entropy decomposes into entropy plus KL divergence: total coding cost equals unavoidable cost plus extra cost from using the wrong distribution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1180" height="620" fill="url(#bg)"/>
  <text x="64" y="74" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">One Coding-Cost Story</text>
  <text x="64" y="110" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Data comes from P. The code may be built from P or from a model Q.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="76" y="170" width="300" height="260" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="112" y="220" font-size="27" font-weight="800" fill="#1d4ed8">Entropy</text>
      <text x="112" y="258" font-size="26" font-weight="800" fill="#0f172a">H(P)</text>
      <text x="112" y="302" font-size="16" fill="#475569">Best possible code</text>
      <text x="112" y="326" font-size="16" fill="#475569">when the true world is P.</text>
      <rect x="112" y="360" width="190" height="36" rx="18" fill="#dbeafe"/>
      <text x="134" y="383" font-size="15" font-weight="700" fill="#1d4ed8">unavoidable cost</text>
    </g>

    <text x="420" y="306" font-size="42" font-weight="800" fill="#475569">+</text>

    <g filter="url(#shadow)">
      <rect x="488" y="170" width="300" height="260" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="524" y="220" font-size="27" font-weight="800" fill="#be123c">KL Divergence</text>
      <text x="524" y="258" font-size="26" font-weight="800" fill="#0f172a">D<tspan baseline-shift="sub" font-size="15">KL</tspan>(P || Q)</text>
      <text x="524" y="302" font-size="16" fill="#475569">Extra cost from using</text>
      <text x="524" y="326" font-size="16" fill="#475569">Q instead of the best code.</text>
      <rect x="524" y="360" width="160" height="36" rx="18" fill="#ffe4e6"/>
      <text x="547" y="383" font-size="15" font-weight="700" fill="#be123c">model mismatch</text>
    </g>

    <path d="M804 300 L836 300" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="852" y="170" width="300" height="260" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="888" y="220" font-size="27" font-weight="800" fill="#047857">Cross Entropy</text>
      <text x="888" y="258" font-size="26" font-weight="800" fill="#0f172a">H(P, Q)</text>
      <text x="888" y="302" font-size="16" fill="#475569">Total average cost</text>
      <text x="888" y="326" font-size="16" fill="#475569">when P-data is coded by Q.</text>
      <rect x="888" y="360" width="150" height="36" rx="18" fill="#dcfce7"/>
      <text x="914" y="383" font-size="15" font-weight="700" fill="#047857">training loss</text>
    </g>

    <rect x="198" y="480" width="784" height="70" rx="18" fill="#0f172a" opacity="0.94"/>
    <text x="266" y="512" font-size="24" font-weight="800" fill="#ffffff">H(P, Q) = H(P) + D<tspan baseline-shift="sub" font-size="14">KL</tspan>(P || Q)</text>
    <text x="266" y="538" font-size="16" fill="#cbd5e1">Cross entropy contains both the world's uncertainty and the model's mismatch.</text>
  </g>
</svg>
